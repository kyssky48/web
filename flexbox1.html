<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    .container div {
      padding: 12px 24px;
      color: white;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .container div:nth-child(1) { background: #0ea5c6; }
    .container div:nth-child(2) { background: #0b6e85; }
    .container div:nth-child(3) { background: #0f172a; }
  </style>
</head>
<body>
  <div class="container">
    <div>박스1</div>
    <div>박스2</div>
    <div>박스3</div>
  </div>
</body>
</html>
